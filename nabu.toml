[device]
codename = "nabu"
brand = "Xiaomi"
model = "Xiaomi Pad 5"
ab = true
recovery_in_boot = true
soc = { hans = "骁龙 860", hant = "Snapdragon 860", en = "Snapdragon 860" }
os_version_prop = "ro.mi.os.version.incremental"

[device.maintainer]
name = "Seimo"
github = "https://github.com/SeimoDev"
x = "https://x.com/SeimoDev"

[display]
width = 1600
height = 2560
density = 360
diagonal = 11.0

# The supplied 4.14.180-moon-os3 kernel builds in NT36523, MSM DRM, UFS,
# ICNSS and the Qualcomm WLAN host driver. Its modules are not GKI modules.
[modules]
sources = []
load = []

# Firmware and secure-world applications follow the installed vendor fstab.
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# Match the port's init.qcom.rc accounts, arguments and capabilities.
[[service]]
path = "/vendor/bin/qrtr-ns"
args = ["-f"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "vendor_qrtr"
groups = ["vendor_qrtr"]
capabilities = ["NET_BIND_SERVICE"]

[[service]]
path = "/vendor/bin/irsc_util"
args = ["/vendor/etc/sec_config"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true

[[service]]
path = "/vendor/bin/pd-mapper"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/rmt_storage"
libraries = ["/system/lib64", "/vendor/lib64"]

[[service]]
path = "/vendor/bin/tftp_server"
libraries = ["/system/lib64", "/vendor/lib64"]

[[service]]
path = "/vendor/bin/pm-service"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/pm-proxy"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/cnss-daemon"
args = ["-n", "-l"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "inet", "net_admin", "wifi"]
capabilities = ["NET_ADMIN"]

[wlan]
modules = []
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
# Service descriptions (AIDL or HIDL) come from the installed ROM's VINTF.
firmware = [
    { name = "wlan/qca_cld/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/WCNSS_qcom_cfg.ini" },
]
probe = "http://connect.rom.miui.com/generate_204"

[backup]
efs = ["persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee"]

[wipe]
logs = ["/data/miuilog", "/data/vendor/diag", "/data/vendor/ramdump", "/data/vendor/tombstones", "/data/vendor/wlan_logs"]
