[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
sys_root = '/work/sysroot'
pkg_config_libdir = ['/work/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig', '/work/sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--sysroot=/work/sysroot']
c_link_args = ['--sysroot=/work/sysroot', '-Wl,-rpath-link,/work/sysroot/usr/lib/aarch64-linux-gnu']
